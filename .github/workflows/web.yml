name: Deploy web (PWA)

on:
  push:
    branches: [main]
    paths:
      [
        'src/**',
        'public/**',
        'assets/**',
        'app.json',
        'package.json',
        'package-lock.json',
        '.github/workflows/web.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 웹 카카오 로그인(#1225)은 브라우저가 kauth와 직접 토큰을 교환하므로 REST 키가
      # 번들에 인라인된다(카카오 문서상 비밀값 아님 — 시크릿은 별도). 레포 variable.
      - run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_KAKAO_REST_API_KEY: ${{ vars.KAKAO_REST_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# dev 브랜치 CI/CD: 머지될 때마다 네이티브 지문을 비교해
# 변화 없으면 OTA(preview 채널), 변했으면 EAS 네이티브 빌드를 자동 실행.
# Android는 preview APK, iOS는 testflight 빌드 + App Store Connect 자동 제출.
# 잡이 빨개지는 건 **이번 머지가 아무에게도 안 갔을 때뿐**이다 (#998) — 빌드
# 쿼터 소진처럼 손쓸 수 없는 실패는 노랑(warning)으로 요약에만 남긴다.
# 필요 시크릿: EXPO_TOKEN (expo.dev → Access tokens), ASC_API_KEY_P8 (ASC API 키 .p8 원문)
name: eas-deploy
on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: eas-deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # 같은 지문의 직전 빌드가 실패해 있으면 자동 재시도를 막는다 (#1034).
      # 9/1에 원인 수정 없는 연속 머지가 같은 에러의 빌드 재시도로 쿼터를
      # 태웠다 — 사람이 런을 지켜보다 취소하는 규칙은 연속 머지에서 뚫린다.
      #   · 같은 지문의 FINISHED 빌드가 있으면 스킵하지 않는다(액션이 재사용, 무비용)
      #   · 같은 지문의 최신 시도가 ERRORED거나 아직 도는 중이면 새 빌드를
      #     스킵하고 OTA 폴백만 발행한다
      #   · CANCELED는 스킵 사유가 아니다 — 몰아 머지 절차의 의도된 취소를
      #     재시도 차단으로 읽으면 안 된다
      #   · 조회가 실패하면 항상 skip=false — 가드는 배포를 막는 장치가 아니다
      - name: 실패 재시도 가드 (#1034)
        id: guard
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          for platform in ios android; do
            if [ "$platform" = "ios" ]; then profile=testflight; else profile=preview; fi
            skip=false
            current=$(npx expo-updates fingerprint:generate --platform "$platform" 2>/dev/null | node -e               'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).hash||"")}catch{console.log("")}})')
            builds=$(eas build:list --platform "$platform" --build-profile "$profile" --limit 10 --json --non-interactive 2>/dev/null || echo '[]')
            if [ -n "$current" ]; then
              skip=$(printf '%s' "$builds" | CURRENT_FP="$current" node -e '
                let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                  let skip=false;
                  try{
                    const fp=process.env.CURRENT_FP;
                    const rt=b=>(b.runtime&&b.runtime.version)||(b.fingerprint&&b.fingerprint.hash)||"";
                    const same=JSON.parse(s).filter(b=>rt(b)===fp);
                    if(same.length&&!same.some(b=>b.status==="FINISHED")){
                      const st=same[0].status;
                      skip=(st==="ERRORED"||st==="IN_PROGRESS"||st==="IN_QUEUE"||st==="NEW"||st==="PENDING");
                    }
                  }catch{}
                  console.log(skip);
                })')
            fi
            if [ "$skip" = "true" ]; then
              echo "::warning::$platform — 같은 지문($current)의 직전 $profile 빌드가 실패/진행 중이라 자동 재시도를 건너뜁니다 (#1034). 원인을 고친 뒤 수동으로: eas build -p $platform --profile $profile"
              echo "- ⏭ **$platform**: 같은 지문의 직전 빌드가 실패/진행 중 — 자동 빌드 스킵, OTA 폴백만 발행 (#1034)." >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "skip_$platform=$skip" >> "$GITHUB_OUTPUT"
          done
      # 지문 비교 → 동일하면 eas update(OTA), 다르면 새 빌드.
      # Android: preview APK (internal 배포).
      # continue-on-error: Android 실패(쿼터 소진 등)가 iOS 배포까지 죽이지
      # 않게 한다 (#429) — 실패는 말미 스텝이 다시 표면화해 잡은 빨간색 유지.
      - name: Android — OTA or preview build
        id: android
        if: steps.guard.outputs.skip_android != 'true'
        continue-on-error: true
        uses: expo/expo-github-action/continuous-deploy-fingerprint@main
        with:
          profile: preview
          branch: preview
          platform: android
      # Android 빌드 생성 실패(쿼터 소진 등) 시 OTA만이라도 발행 (#435) —
      # 같은 지문의 로컬 빌드 APK가 JS 변경을 계속 받는다. 빌드가 성공하는
      # 평시에는 액션이 스스로 업데이트를 발행하므로 이 스텝은 건너뛴다.
      - name: Android — OTA fallback
        id: android_fallback
        if: steps.android.outcome == 'failure' || steps.guard.outputs.skip_android == 'true'
        # 말미 판정 스텝이 이 결과를 읽어 빨강/노랑을 가른다 (#998) — 여기서
        # 잡을 죽이면 그 판정도, 도달 여부 점검도 돌지 못한다.
        continue-on-error: true
        run: eas update --branch preview --platform android --non-interactive --auto
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # iOS 제출용 ASC API 키 복원 — eas.json의 ascApiKeyPath(./asc-api-key.p8)가 읽는다.
      - name: Restore ASC API key
        run: printf '%s' "$ASC_API_KEY_P8" > asc-api-key.p8
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      # iOS: 네이티브 변경 시 testflight 빌드 + TestFlight 자동 제출 (ad-hoc 미사용).
      - name: iOS — OTA or TestFlight build
        id: ios
        if: steps.guard.outputs.skip_ios != 'true'
        continue-on-error: true
        uses: expo/expo-github-action/continuous-deploy-fingerprint@main
        with:
          profile: testflight
          branch: preview
          platform: ios
          auto-submit-builds: true
      # iOS도 빌드 생성 실패(쿼터 소진 등) 시 OTA만이라도 발행 — Android
      # 폴백(#435)과 대칭. 7/31 쿼터 소진 때 iOS OTA만 조용히 누락됐던 구멍.
      - name: iOS — OTA fallback
        id: ios_fallback
        if: steps.ios.outcome == 'failure' || steps.guard.outputs.skip_ios == 'true'
        continue-on-error: true
        run: eas update --branch preview --platform ios --non-interactive --auto
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # OTA로 나간 JS는 네이티브 빌드와 **다른 번들**이다 — 소스맵을 안 올리면
      # 이 업데이트에서 난 에러 스택이 압축된 채로 남아 못 읽는다 (#884).
      # 정작 문제를 가장 많이 만나는 레인인데 release·hotfix에만 있었다.
      #
      # `dist`는 위 스텝들이 `eas update`를 돌리며 만든다. 액션이 내부 임시
      # 디렉터리를 쓰는 경우엔 없을 수 있어, 없으면 조용히 건너뛴다 —
      # 관측 도구가 배포를 막으면 안 된다.
      - name: Sentry 소스맵 업로드 (dev 레인 OTA)
        if: env.SENTRY_AUTH_TOKEN != '' && hashFiles('dist/**') != ''
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npx @sentry/expo-upload-sourcemaps dist

      # 발행 성공 ≠ 도달. preview 채널에 **현재 지문의 빌드가 없으면** 업데이트는
      # 아무도 듣지 않는 레인에 쌓인다 (#938 — iOS가 실제로 그 상태다).
      # eas-release의 production 판정과 같은 장치를 dev 레인에 둔다: 조용한
      # 실패를 드러내는 게 전부이고, 배포를 막지는 않는다.
      - name: dev 레인 OTA 도달 여부 점검 (지문 대조)
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # 액션이 OTA를 보냈는지 새 빌드를 걸었는지로 판정이 갈린다.
          IOS_OUTCOME: ${{ steps.ios.outcome }}
          ANDROID_OUTCOME: ${{ steps.android.outcome }}
        run: |
          for platform in ios android; do
            # preview 채널을 채우는 프로필이 플랫폼마다 다르다.
            if [ "$platform" = "ios" ]; then
              profile=testflight; outcome="$IOS_OUTCOME"
            else
              profile=preview; outcome="$ANDROID_OUTCOME"
            fi
            current=$(npx expo-updates fingerprint:generate --platform "$platform" | node -e \
              'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).hash)}catch{console.log(s.trim())}})')
            shipped=$(eas build:list --platform "$platform" --build-profile "$profile" --limit 1 \
              --status finished --json --non-interactive | node -e \
              'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const b=JSON.parse(s)[0]||{};const v=(b.runtime&&b.runtime.version)||(b.fingerprint&&b.fingerprint.hash)||"";console.log(v)}catch{console.log("")}})')
            # 지문 조회가 실패한 경우도 판정하지 않는다 — 빈 값끼리 비교하면
            # 거짓 경고가 난다(예전에 "undefined" 문자열이 그렇게 새어나갔다).
            if [ -z "$current" ] || [ "$current" = "undefined" ] \
               || [ -z "$shipped" ] || [ "$shipped" = "undefined" ]; then
              echo "::notice::$platform — 지문을 확인하지 못했습니다(현재=$current, preview=$shipped). 도달 여부를 판정하지 않았습니다."
              echo "- **$platform**: 지문 확인 불가 — 도달 여부 미판정." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$current" = "$shipped" ]; then
              echo "- ✅ **$platform**: 지문 일치 (\`$current\`) — 테스터 설치본이 이 OTA를 받습니다." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$outcome" != "success" ]; then
              # 빌드가 실패했거나(failure) 가드가 막아(skipped) 폴백만 OTA를
              # 쐈는데, 그 런타임을 가진 설치본이 없다.
              # 이게 진짜 조용한 실패다 — 발행은 성공하고 수신자만 0이다.
              echo "::warning::$platform — 이 OTA는 **수신자가 없습니다** (이번 $current ≠ preview 빌드 $shipped). 발행은 됐지만 그 런타임을 가진 설치본이 없습니다 — $profile 프로필로 새 빌드가 필요합니다."
              echo "- ⚠️ **$platform**: 지문 불일치 (\`$current\` ≠ preview \`$shipped\`) — **이 OTA는 아무에게도 안 갑니다**. $profile 빌드 필요." >> "$GITHUB_STEP_SUMMARY"
            else
              # 액션이 성공했는데 지문이 다르다 = 네이티브가 바뀌어 **새 빌드를
              # 건 정상 경로**다. OTA를 보낸 적이 없으므로 경고할 일이 아니다.
              echo "::notice::$platform — 네이티브 지문이 바뀌어 새 $profile 빌드를 시작했습니다. 이번엔 OTA를 보내지 않았습니다."
              echo "- 🛠 **$platform**: 지문 변경 (\`$current\`) — 새 $profile 빌드 진행 중, OTA 없음." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # 스토어 사용자에게 지금 보낼 수 있는지 (#998). 위 점검은 **preview 레인**만
      # 본다 — dev 머지 OTA가 가는 곳이라 그게 맞다. 그런데 "iOS 프리뷰 빌드가
      # 낡았다"를 "iOS에 아무것도 못 보낸다"로 읽는 사고가 실제로 났다:
      # 프리뷰(testflight)가 v1.1.0에 멈춰 있는 동안 **production 빌드는 현재
      # 지문과 같았고**, eas-release 한 번이면 스토어 사용자 전원에게 갈 수
      # 있었다. 판단 근거를 매 런의 요약에 남겨 그 오독을 막는다.
      - name: production 레인 도달 여부 (참고)
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          for platform in ios android; do
            current=$(npx expo-updates fingerprint:generate --platform "$platform" | node -e \
              'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).hash)}catch{console.log(s.trim())}})')
            store=$(eas build:list --platform "$platform" --build-profile production --limit 1 \
              --status finished --json --non-interactive | node -e \
              'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const b=JSON.parse(s)[0]||{};const v=(b.runtime&&b.runtime.version)||(b.fingerprint&&b.fingerprint.hash)||"";console.log(v)}catch{console.log("")}})')
            if [ -z "$current" ] || [ -z "$store" ] || [ "$current" = "undefined" ] || [ "$store" = "undefined" ]; then
              continue
            elif [ "$current" = "$store" ]; then
              echo "- 📦 **$platform**: production 빌드도 같은 지문 — \`eas-release\`로 스토어 사용자에게 바로 보낼 수 있습니다." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- 📦 **$platform**: production 빌드 지문이 다릅니다 (\`$store\`) — 스토어 사용자에게 보내려면 새 빌드가 필요합니다." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # 빨간불은 **지금 할 수 있는 일이 있을 때만** 켠다 (#998).
      #
      # 종전엔 플랫폼 스텝이 실패하면 무조건 exit 1이었다. 그런데 그 실패의
      # 대부분은 EAS 무료 플랜 빌드 쿼터 소진이다 — 코드 문제가 아니라 예산
      # 문제고, 결제 주기가 바뀌기 전엔 손쓸 방법이 없다. 8/22~8/28에 15런이
      # 연속 빨간불이었고(iOS 15/15 소진), 그 사이 진짜 실패가 났어도 구분할
      # 수 없었다. 늑대소년을 만드는 대가가 빨간불의 가치보다 크다.
      #
      # 판정은 원인이 아니라 **결과**로 한다 — 빌드가 왜 실패했는지 액션은
      # 알려주지 않지만, "이번 머지의 JS가 나갔는가"는 폴백의 결과로 안다.
      #   🔴 빌드도 OTA도 실패 = 이번 머지가 아무에게도 안 갔다. 조치 가능.
      #   🟡 빌드는 못 걸었지만 OTA는 나갔다. 쿼터 리셋 전엔 할 게 없다.
      # 도달 여부(수신자 0인 레인)는 위 두 점검이 요약과 주석으로 남긴다.
      - name: 배포 결과 판정
        if: steps.android.outcome == 'failure' || steps.ios.outcome == 'failure'
        env:
          ANDROID_OUTCOME: ${{ steps.android.outcome }}
          IOS_OUTCOME: ${{ steps.ios.outcome }}
          ANDROID_FALLBACK: ${{ steps.android_fallback.outcome }}
          IOS_FALLBACK: ${{ steps.ios_fallback.outcome }}
        run: |
          fatal=0
          classify() {
            platform=$1; step=$2; fallback=$3
            [ "$step" = "failure" ] || return 0
            if [ "$fallback" = "success" ]; then
              echo "::warning::$platform — 새 빌드는 걸지 못했지만(쿼터 소진 등) OTA 폴백은 발행됐습니다. 빌드가 필요하면 쿼터 리셋 뒤에, 급하면 \`eas build --local\` + \`eas submit --path\`로."
              echo "- 🟡 **$platform**: 빌드 생성 실패 · OTA 폴백 발행됨." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$platform — 빌드도 OTA도 실패했습니다. **이번 머지의 JS는 아무에게도 가지 않았습니다.**"
              echo "- 🔴 **$platform**: 빌드·OTA 모두 실패 — 이번 머지는 배포되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
              fatal=1
            fi
          }
          classify ios "$IOS_OUTCOME" "$IOS_FALLBACK"
          classify android "$ANDROID_OUTCOME" "$ANDROID_FALLBACK"
          [ "$fatal" = 0 ] || exit 1

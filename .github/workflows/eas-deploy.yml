# dev 브랜치 CI/CD: 머지될 때마다 네이티브 지문을 비교해
# 변화 없으면 OTA(preview 채널), 변했으면 EAS 네이티브 빌드를 자동 실행.
# 필요 시크릿: EXPO_TOKEN (expo.dev → Access tokens → repo Settings/Secrets에 등록)
name: eas-deploy
on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: eas-deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # 지문 비교 → 동일하면 eas update(OTA), 다르면 eas build --auto-submit 없이 빌드
      - uses: expo/expo-github-action/continuous-deploy-fingerprint@main
        with:
          profile: preview
          branch: preview
          platform: all

name: ios-release-smoke
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  release-smoke:
    if: contains(github.event.pull_request.labels.*.name, 'release-smoke') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    concurrency:
      group: ios-release-smoke-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare Release native project
        timeout-minutes: 10
        run: |
          xcodebuild -version
          npx expo prebuild --platform ios --no-install
          node scripts/check-ios-plist.mjs
          cd ios
          pod install
      # Fail fast on CoreSimulator hangs before spending time on a native build.
      - name: Select Release simulator
        timeout-minutes: 2
        run: |
          set -x
          mkdir -p release-smoke
          xcrun simctl list devices available --json > release-smoke/devices.json
          simulator_sdk_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "$simulator_sdk_version" > release-smoke/sdk-version.txt
          simulator=$(node scripts/select-ios-simulator.js release-smoke/devices.json "$simulator_sdk_version")
          echo "SIMULATOR_UDID=$simulator" >> "$GITHUB_ENV"
          echo "$simulator" > release-smoke/simulator.txt
      - name: Boot Release simulator
        timeout-minutes: 5
        run: |
          set -x
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b 2>&1 | tee release-smoke/boot.log
      - name: Build Release simulator app
        timeout-minutes: 25
        run: |
          xcodebuild -workspace ios/Rougether.xcworkspace -scheme Rougether \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/rougether-release" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            > release-smoke/build.log 2>&1
      - name: Install and launch Release app
        timeout-minutes: 3
        run: |
          set -x
          xcrun simctl install "$SIMULATOR_UDID" "$RUNNER_TEMP/rougether-release/Build/Products/Release-iphonesimulator/Rougether.app"
          xcrun simctl launch "$SIMULATOR_UDID" com.triples.rougether | tee release-smoke/launch.txt
      - name: Capture first screen and verify process
        timeout-minutes: 2
        run: |
          set -x
          sleep 12
          xcrun simctl io "$SIMULATOR_UDID" screenshot release-smoke/first-screen.png
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 2m --style compact \
            --predicate 'process == "Rougether"' > release-smoke/app.log
          xcrun simctl spawn "$SIMULATOR_UDID" launchctl list | grep com.triples.rougether > release-smoke/process.txt
          app_pid=$(awk -F ': ' '/^com[.]triples[.]rougether: [0-9]+$/ { print $2 }' release-smoke/launch.txt)
          test -n "$app_pid"
          awk -v pid="$app_pid" '$1 == pid { alive=1 } END { exit !alive }' release-smoke/process.txt
          echo 'Release launch evidence saved. Manually inspect first-screen.png before TestFlight submission.' >> "$GITHUB_STEP_SUMMARY"
      - name: Collect simulator diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: |
          mkdir -p release-smoke
          ps -axo pid,ppid,state,etime,comm > release-smoke/runner-processes.txt
          /usr/bin/log show --last 5m --style compact \
            --predicate 'process == "CoreSimulatorService" OR process == "simctl"' \
            > release-smoke/simulator.log 2>&1
      - name: Shut down Release simulator
        if: always() && env.SIMULATOR_UDID != ''
        continue-on-error: true
        timeout-minutes: 1
        run: xcrun simctl shutdown "$SIMULATOR_UDID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-release-smoke-${{ github.event.pull_request.head.sha }}
          path: release-smoke/
          retention-days: 7

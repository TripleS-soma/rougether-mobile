# native-build 라벨 PR 사전 검증 (#433): EAS 빌드(쿼터·과금)를 태우기 전에
# GitHub Actions에서 prebuild 산출물과 Android 매니페스트 병합을 공짜로 검증한다.
# 매니페스트 병합(:app:processReleaseMainManifest)은 #414류 config-plugin 충돌을
# 전체 빌드 없이 잡아내는 최소 Gradle 태스크다.
name: native-prebuild-check
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  # iOS Info.plist 산출물 검증 (#915) — **라벨 없이 모든 PR에서** 돌린다.
  # 1.2.0 빌드 47을 죽인 #913의 PR(#914)은 native-build 라벨이 없어 아래
  # prebuild 잡을 건너뛰었다. 그 구멍이 이번 사고의 한 축이라, 이 잡만은
  # 라벨과 무관하게 항상 돈다(prebuild --no-install이라 몇십 초면 끝난다).
  ios-plist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Expo prebuild (ios)
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Info.plist 필수 권한 키 검증
        run: node scripts/check-ios-plist.mjs

  prebuild:
    # 라벨이 native-build인 PR에서만.
    if: contains(github.event.pull_request.labels.*.name, 'native-build')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # 이 워크플로는 매니페스트 병합만 검증한다 — 산출물을 쓰지 않으므로
      # Sentry 소스맵 업로드는 끈다. 켜두면 토큰이 없어 빌드가 통째로 실패한다
      # (#801에서 실제로 실패했다: "Auth token is required for this request").
      #
      # #807에서 EAS env에 SENTRY_AUTH_TOKEN을 넣었지만 **여기는 EAS가 아니다**
      # — GitHub 러너라 EAS env를 못 본다. 게다가 버리는 산출물의 소스맵을
      # 올릴 이유도 없다. 그래서 이 잡만은 계속 끈 채로 둔다.
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install
      - name: Android manifest merge
        working-directory: android
        run: ./gradlew :app:processReleaseMainManifest --no-daemon --stacktrace

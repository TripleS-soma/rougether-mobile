name: christmas-production-readonly-status
on:
  push:
    branches: [codex/christmas-production-readonly-status]
    paths:
      - .github/workflows/christmas-production-readonly-status.yml
      - scripts/inspect-christmas-production.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 기존 EAS 빌드와 App Store 출시 상태 조회
        run: node scripts/inspect-christmas-production.js
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: christmas-production-readonly-status
          path: production-readonly-status.json
          retention-days: 7
          if-no-files-found: ignore

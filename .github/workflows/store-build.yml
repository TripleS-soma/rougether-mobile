name: android-runtime-inspect
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: '23.2.0'
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Read Android build identifiers only
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const value = JSON.parse(execFileSync('eas', ['build:list', '--platform', 'android', '--limit', '40', '--json', '--non-interactive'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }));
          if (!Array.isArray(value)) throw new Error('Unexpected build list');
          const clean = s => typeof s === 'string' ? s.slice(0, 200) : null;
          for (const b of value) console.log(JSON.stringify({ id: clean(b.id), status: clean(b.status), profile: clean(b.buildProfile), channel: clean(b.channel), version: clean(b.appVersion), versionCode: clean(b.appBuildVersion), source: clean(b.gitCommitHash), runtime: clean(b.runtime?.version || b.fingerprint?.hash), createdAt: clean(b.createdAt) }));
          NODE
      - name: Read production update identifiers only
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const value = JSON.parse(execFileSync('eas', ['update:list', '--branch', 'production', '--limit', '100', '--json', '--non-interactive'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }));
          const groups = Array.isArray(value) ? value : value.currentPage;
          if (!Array.isArray(groups)) throw new Error('Unexpected update list');
          const clean = s => typeof s === 'string' ? s.slice(0, 300) : null;
          for (const u of groups) console.log(JSON.stringify({ group: clean(u.group || u.id), runtime: clean(u.runtimeVersion), source: clean(u.gitCommitHash), message: clean(u.message), platforms: u.platforms, createdAt: clean(u.createdAt) }));
          NODE

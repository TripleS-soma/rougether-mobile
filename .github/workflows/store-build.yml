# 스토어 제출용 빌드 — production은 **main에서만**, 수동 트리거로만 돈다.
# testflight-build-only는 명시한 커밋의 조회/빌드 전용이며 제출·OTA는 하지 않는다.
#
# 왜 수동인가: EAS 무료 쿼터(월 30회)를 사람이 통제해야 하고(AGENTS.md 빌드
# 절약 규칙), 스토어 제출 타이밍은 심사·메타데이터 준비와 묶여 있다.
#
# 왜 main인가: production 프로필 빌드는 channel=production이라 main 승격이
# 발행하는 OTA(eas-release.yml)만 받는다. dev 머지 OTA(preview 채널)가 스토어
# 사용자에게 검증 없이 흘러가던 경로를 이 조합이 끊는다.
#
# 필요 시크릿: EXPO_TOKEN. production 제출은 EAS 저장 ASC 키를 쓴다.
# submit-only는 GitHub ASC_API_KEY_P8를 임시 0600 파일로 사용한 뒤 항상 제거한다.
# Android 제출은 ./play-service-account.json이 있어야 해서 여기서는 빌드만 한다.
name: store-build
on:
  workflow_dispatch:
    inputs:
      mode:
        description: production 빌드, TestFlight 빌드 전용, 또는 기존 115 제출 전용
        type: choice
        options: [production, testflight-build-only, testflight-submit-only]
        default: production
      action:
        description: TestFlight 전용 (inspect 조회, build 새 빌드, submit 기존 115 제출)
        type: choice
        options: [inspect, build, submit]
        default: inspect
      expected_source_sha:
        description: 'TestFlight 대상 앱 소스 SHA (40자리, 제출 시 기존 115의 앱 소스)'
        type: string
        required: false
      platform:
        description: 빌드할 플랫폼
        type: choice
        options: [ios, android, all]
        default: ios
      submit:
        # 기본 false — 옵션을 안 건드리고 "일단 돌려보는" 첫 실행이 실제 스토어
        # 제출이 되면 안 된다. 제출은 명시적으로 체크할 때만.
        description: production 자동 제출 또는 submit-only의 기존 115 제출 명시 승인
        type: boolean
        default: false
      expected_ios_build:
        description: '빌드 시 예상 다음 번호(선택), submit-only에서는 기존 번호 115(필수)'
        type: string
        required: false
      existing_build_id:
        description: 'testflight-submit-only로 제출할 기존 115번 EAS 빌드 ID'
        type: string
        required: false
      expected_tooling_sha:
        description: 'testflight-submit-only 실행 코드 SHA (기존 앱 source SHA와 별개)'
        type: string
        required: false

jobs:
  build:
    if: inputs.mode == 'production' || inputs.mode == ''
    runs-on: ubuntu-latest
    concurrency:
      group: store-build
      cancel-in-progress: false
    steps:
      # main 외 브랜치에서 실행하면 스토어에 dev 스냅샷이 올라간다 — 막는다.
      - name: main 브랜치인지 확인
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::스토어 빌드는 main에서만 돌립니다 (현재: ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # 어떤 런타임으로 나가는지 로그에 남긴다 — 이 지문이 곧 이 빌드가 받을
      # OTA 레인이고, production 채널 업데이트와 맞아야 사용자에게 도달한다.
      - name: 런타임 지문 기록
        continue-on-error: true
        run: |
          echo "iOS     $(npx expo-updates fingerprint:generate --platform ios)"
          echo "Android $(npx expo-updates fingerprint:generate --platform android)"

      - name: iOS — App Store 빌드 (+제출)
        if: inputs.platform == 'ios' || inputs.platform == 'all'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPECTED_IOS_BUILD: ${{ inputs.expected_ios_build }}
        run: |
          if [ -n "$EXPECTED_IOS_BUILD" ]; then
            eas build:version:get --platform ios --profile production --json --non-interactive | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                const current=Number(JSON.parse(s).buildNumber);
                const expected=Number(process.env.EXPECTED_IOS_BUILD);
                if(!Number.isInteger(current)||!Number.isInteger(expected)||current+1!==expected){
                  console.error(`Build number drift: current=${current}, expected next=${expected}`); process.exit(1);
                }
                console.log(`Confirmed next iOS build: ${expected}`);
              });'
          fi
          if [ "${{ inputs.submit }}" = "true" ]; then
            # 자동 제출은 빌드 완료를 기다려야 성립한다 — --no-wait면 큐에 넣고
            # CLI가 종료돼 제출이 일어나지 않는다. 대신 러너가 빌드 내내(20~40분)
            # 살아 있어야 한다.
            eas build --platform ios --profile production --non-interactive \
              --auto-submit-with-profile production
          else
            eas build --platform ios --profile production --non-interactive --no-wait
          fi

      # Play 제출은 서비스 계정 JSON이 리포에 없어 수동이다 — 아티팩트를 받아
      # 콘솔에 올리거나, 키가 준비되면 --auto-submit-with-profile production 추가.
      - name: Android — Play 번들 빌드
        if: inputs.platform == 'android' || inputs.platform == 'all'
        run: eas build --platform android --profile production --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  testflight-build-only:
    if: inputs.mode == 'testflight-build-only'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      checks: read
    concurrency:
      group: eas-deploy-dev
      cancel-in-progress: false
    env:
      BUILD_MODE: ${{ inputs.mode }}
      BUILD_ACTION: ${{ inputs.action }}
      BUILD_PLATFORM: ${{ inputs.platform }}
      BUILD_SUBMIT: ${{ inputs.submit }}
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      EXPECTED_IOS_BUILD: ${{ inputs.expected_ios_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 명시한 커밋 및 빌드 전용 설정 확인
        run: node scripts/check-testflight-build.js validate
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: iOS 1.5.0 후보 조회 또는 빌드 (제출·OTA 없음)
        run: node scripts/check-testflight-build.js
        env:
          GH_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  testflight-submit-only:
    if: inputs.mode == 'testflight-submit-only'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
    concurrency:
      group: eas-deploy-dev
      cancel-in-progress: false
    env:
      SUBMIT_MODE: ${{ inputs.mode }}
      SUBMIT_ACTION: ${{ inputs.action }}
      SUBMIT_PLATFORM: ${{ inputs.platform }}
      SUBMIT_AUTHORIZED: ${{ inputs.submit }}
      EXISTING_BUILD_ID: ${{ inputs.existing_build_id }}
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      EXPECTED_IOS_BUILD: ${{ inputs.expected_ios_build }}
      EXPECTED_TOOLING_SHA: ${{ inputs.expected_tooling_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 기존 빌드와 제출 실행 코드 식별자 확인
        run: node scripts/submit-testflight-build.js validate
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 23.2.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: 기존 iOS 1.5.0 (115) 조회 또는 TestFlight 제출
        run: node scripts/submit-testflight-build.js
        env:
          GH_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      - name: 임시 ASC 개인키 제거
        if: always()
        run: node scripts/submit-testflight-build.js cleanup

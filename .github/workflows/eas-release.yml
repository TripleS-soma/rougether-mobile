# 스토어 사용자용 production 채널 OTA. 스토어 빌드는 channel=production이라
# preview 채널(dev용, eas-deploy.yml)의 업데이트를 받지 않는다 — 이 워크플로가
# 그 짝이다.
#
# **수동 실행만** (#813): 예전에는 main push마다 자동 발행했는데, 심사 중인
# 빌드도 production 채널을 듣기 때문에 승격이 곧 "심사자가 보는 코드를 바꾸는
# 일"이 됐다. 제출본과 다른 코드가 심사대에 오르는 건 거부 사유가 될 수 있다.
# 그래서 발행 시점을 사람이 정한다 — **심사 통과·출시 이후**에 실행할 것.
#
# main 머지는 이제 "릴리스 후보 확정"까지만 한다. 사용자에게 보내는 행위는
# 이 워크플로를 누르는 순간이다.
#
# 의도적으로 OTA 전용: 네이티브 변경의 production 빌드는 store-build로 돌린다.
name: eas-release
on:
  workflow_dispatch:

jobs:
  ota:
    runs-on: ubuntu-latest
    concurrency:
      group: eas-release-main
      cancel-in-progress: false
    env:
      # 토큰이 없는 저장소(포크 등)에서도 배포는 계속되게 — 아래 스텝이 스스로 빠진다.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      # main 외 브랜치에서 발행하면 스토어 사용자에게 미검증 코드가 간다.
      - name: main 브랜치인지 확인
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::production OTA는 main에서만 발행합니다 (현재: ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish production OTA (both platforms)
        run: eas update --branch production --non-interactive --auto
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # OTA로 나간 JS는 네이티브 빌드와 다른 번들이다 — 여기서 소스맵을 안
      # 올리면 이 업데이트에서 난 에러의 스택이 압축된 채로 남아 못 읽는다
      # (#801). org/project는 app.json의 Sentry 플러그인 설정에서 읽는다.
      - name: Sentry 소스맵 업로드 (OTA)
        if: env.SENTRY_AUTH_TOKEN != ''
        continue-on-error: true
        # 로컬 bin 강제 (#1026) — `npx @sentry/…`는 레지스트리의 다른 패키지를
        # 받아 @expo/env 부재로 죽는다. eas-deploy의 같은 스텝과 동일한 이유.
        run: |
          if ! npx --no-install sentry-expo-upload-sourcemaps dist; then
            echo "::warning::Sentry 소스맵 업로드 실패 — 이 OTA에서 난 JS 에러의 스택이 난독화된 채로 수집됩니다 (#1026). 배포 자체는 계속됩니다."
            echo "- ⚠️ Sentry 소스맵 업로드 실패 — 이 OTA의 에러 스택은 난독 상태." >> "$GITHUB_STEP_SUMMARY"
          fi

      # 발행은 항상 성공한다 — 문제는 "그 업데이트를 받을 설치본이 있는가"다.
      # 런타임 지문이 스토어에 나가 있는 production 빌드와 다르면 업데이트는
      # 아무도 듣지 않는 레인에 쌓이고 워크플로는 초록색으로 끝난다. 그 침묵을
      # 깨는 게 이 스텝의 전부다 — 배포를 막지는 않는다(실패시키지 않음).
      - name: OTA 도달 여부 점검 (지문 대조)
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          for platform in ios android; do
            current=$(npx expo-updates fingerprint:generate --platform "$platform" | node -e \
              'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).hash)}catch{console.log(s.trim())}})')
            # 필드는 `runtime.version`이다 (fallback: `fingerprint.hash`).
            # 예전엔 `b.runtimeVersion`을 읽었는데 그런 키가 없어서 undefined가
            # 나왔고, `console.log(undefined)`가 **문자열 "undefined"** 를 찍어
            # 아래 -z 분기를 그냥 지나쳐 매번 "지문 불일치"로 경고했다. 조용한
            # 실패를 잡는 스텝이 거꾸로 매번 늑대야를 외치던 셈 (2026-08-17).
            shipped=$(eas build:list --platform "$platform" --build-profile production --limit 1 \
              --status finished --json --non-interactive | node -e \
              'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const b=JSON.parse(s)[0]||{};const v=(b.runtime&&b.runtime.version)||(b.fingerprint&&b.fingerprint.hash)||"";console.log(v)}catch{console.log("")}})')
            # 조회 실패("")와 빌드 없음을 구분할 수 없으니 둘 다 notice로 흘린다
            # — 확실하지 않은 걸 경고로 올리면 진짜 경고의 신호가 죽는다.
            if [ -z "$shipped" ] || [ "$shipped" = "undefined" ]; then
              echo "::notice::$platform — 스토어(production 프로필) 빌드의 런타임을 확인하지 못했습니다(빌드 없음 또는 조회 실패). 도달 여부를 판정하지 않았습니다."
              echo "- **$platform**: 스토어 빌드 런타임 확인 불가(빌드 없음 또는 조회 실패) — 도달 여부 미판정." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$current" != "$shipped" ]; then
              echo "::warning::$platform — 런타임 지문이 스토어 빌드와 다릅니다 (이번 $current ≠ 스토어 $shipped). 이 OTA는 기존 설치본에 도달하지 않습니다 — store-build 워크플로로 새 빌드를 내야 합니다."
              echo "- ⚠️ **$platform**: 지문 불일치 (\`$current\` ≠ 스토어 \`$shipped\`) — **OTA 도달 안 함**. store-build 필요." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ✅ **$platform**: 지문 일치 (\`$current\`) — 기존 설치본이 이 OTA를 받습니다." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

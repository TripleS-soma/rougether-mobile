# main 승격(dev→main 릴리스 PR 머지) 시 스토어 사용자용 production 채널에
# OTA를 발행한다. 스토어 빌드는 channel=production이라 preview 채널(dev용,
# eas-deploy.yml)의 업데이트를 받지 않는다 — 이 워크플로가 그 짝이다.
#
# 의도적으로 OTA 전용: main의 스토어 빌드는 runtimeVersion=appVersion이므로
# 네이티브 지문이 기준 빌드와 다르면 업데이트를 발행하지 않는다. 기준 지문은
# 새 production 스토어 빌드를 배포할 때만 갱신한다.
name: eas-release
on:
  push:
    branches: [main]

jobs:
  ota:
    runs-on: ubuntu-latest
    concurrency:
      group: eas-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Verify baseline against finished production builds
        run: node scripts/check-production-build-baseline.js
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Verify production OTA fingerprint and endpoint environment
        run: eas env:exec production "node scripts/check-production-ota-safety.js" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Publish production OTA (both platforms)
        run: eas update --channel production --environment production --non-interactive --auto
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

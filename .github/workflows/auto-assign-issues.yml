name: Auto-assign issues

# Every new issue is assigned to the project owner so the GitHub Project board
# always shows an assignee (requested workflow: issues → org project #2).
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign to evan7484
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --add-assignee evan7484

name: hotfix-ota
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [production]
        required: true
      platform:
        type: choice
        options: [all]
        required: true
      expected_runtime:
        required: true
jobs:
  restore:
    runs-on: ubuntu-latest
    concurrency:
      group: hotfix-ota
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: expo/expo-github-action@v8
        with:
          eas-version: '23.2.0'
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Verify exact pre-incident artifacts
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update:view 7396dc2d-278d-4363-bfc0-806d63e21d50 --json > /tmp/previous-ios.json
          eas update:view af881655-11e1-47b7-b4d2-72caf8fa8609 --json > /tmp/previous-android.json
          node - <<'JS'
          const fs = require('fs');
          for (const [name, runtime] of [['ios','05075342d97bf87a62b87b04cdde1d9f48776a4b'],['android','1ccb054b5edc8a6d0e4fdf6b61155c7b8a52ddaa']]) {
            const data = JSON.parse(fs.readFileSync('/tmp/previous-'+name+'.json','utf8'));
            if (!JSON.stringify(data).includes(runtime)) throw new Error('Unexpected previous runtime: '+name);
            console.log('Verified pre-incident artifact and runtime: '+name+' '+runtime);
          }
          JS
      - name: Restore previous iOS artifact without rebuilding
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update:republish --group 7396dc2d-278d-4363-bfc0-806d63e21d50 --destination-branch production --platform ios --message 'Emergency restore pre-Pepero iOS artifact' --json --non-interactive
      - name: Restore previous Android artifact without rebuilding
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update:republish --group af881655-11e1-47b7-b4d2-72caf8fa8609 --destination-branch production --platform android --message 'Emergency restore pre-Pepero Android artifact' --json --non-interactive
